name: Main workflow

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Every Monday: prime the caches, and test js_of_ocaml master
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 5
          - 4

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-pin: false

      # The client tests run under Node.js; WebAssembly GC needs Node.js 22
      # or later.
      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # wasm_of_ocaml needs Binaryen 120 or later
      - name: Set-up Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      # The macOS image defaults to OpenSSL 4, which has no SSLv3: ssl 0.8.0
      # then fails to create Conduit's default server context, and every
      # test server dies at startup. Build ssl against OpenSSL 3 until ssl
      # handles it.
      - if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      # The weekly run also tests js_of_ocaml master
      - if: github.event_name == 'schedule' && runner.os == 'Linux' && matrix.ocaml-compiler == 5
        run: opam pin -y git+https://github.com/ocsigen/js_of_ocaml#master
      - run: opam install . --deps-only --with-test -y

      - run: opam exec -- dune build -p eliom,eliom-compat

      - run: opam exec -- dune runtest -p eliom,eliom-compat

      # Browser tests (test/e2e), not required to pass for now
      - name: Browser tests
        id: e2e
        if: runner.os == 'Linux' && matrix.ocaml-compiler == 5
        continue-on-error: true
        working-directory: test/e2e
        env:
          E2E_BROWSERS: chromium,firefox,webkit
        run: |
          opam exec -- dune build @app/all
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test

      # With continue-on-error, failure() stays false: test the outcome
      - name: Upload the logs of the browser tests
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: |
            test/e2e/server-data/**/*.log
            test/e2e/test-results/
          if-no-files-found: ignore

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4
          dune-cache: true

      - uses: ocaml/setup-ocaml/lint-fmt@v3
