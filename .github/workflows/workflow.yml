name: Main workflow

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 5
          - 4

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-pin: false

      - name: Set-up Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      # Ocsigen Server 8.0.0 is released on GitHub but not yet published on
      # opam (ocaml/opam-repository#30806): pin the release tag until then,
      # so CI tests the declared artifact.
      - run: opam pin -y git+https://github.com/ocsigen/ocsigenserver#8.0.0
      # Eliom needs ocsipersist's Decoding_error API, not released yet
      # (3.1.0, ocsigen/ocsipersist#34): pin master until then.
      - run: opam pin -yn git+https://github.com/ocsigen/ocsipersist#master
      # Published js_of_ocaml (6.3.2) caps at ocaml < 5.5; pin master for
      # 5.5 support (also pulls wasm_of_ocaml, hence the binaryen set-up).
      - run: opam pin -y git+https://github.com/ocsigen/js_of_ocaml#master
      - run: opam install . --deps-only -y

      - run: opam exec -- dune build -p eliom,eliom-compat

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4
          dune-cache: true

      - uses: ocaml/setup-ocaml/lint-fmt@v3
