name: Main workflow

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 5
          - 4

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-pin: false

      # The client tests run under Node.js; WebAssembly GC needs Node.js 22
      # or later.
      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set-up Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      # The macOS image defaults to OpenSSL 4, which has no SSLv3: ssl 0.8.0
      # then fails to create Conduit's default server context, and every
      # test server dies at startup. Build ssl against OpenSSL 3 until ssl
      # handles it.
      - if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Published js_of_ocaml (6.3.2) caps at ocaml < 5.5; pin master for
      # 5.5 support (also pulls wasm_of_ocaml, hence the binaryen set-up).
      - run: opam pin -y git+https://github.com/ocsigen/js_of_ocaml#master
      - run: opam install . --deps-only --with-test -y

      - run: opam exec -- dune build -p eliom,eliom-compat

      - run: opam exec -- dune runtest -p eliom,eliom-compat

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4
          dune-cache: true

      - uses: ocaml/setup-ocaml/lint-fmt@v3
