<!-- Configuration for running the application as a module dynamically loaded
     by ocsigenserver, as an alternative to the statically linked executable
     built from app/main/.

       dune build
       dune exec -- ocsigenserver -c %%%PROJECT_NAME%%%.conf
-->
<ocsigen>
  <server>
    <port>8080</port>
    <logdir>local/var/log/%%%PROJECT_NAME%%%</logdir>
    <commandpipe>local/var/run/%%%PROJECT_NAME%%%-cmd</commandpipe>
    <charset>utf-8</charset>
    <uploaddir>/tmp</uploaddir>
    <!-- The absolute links take the host name of the request. In production,
         behind a reverse proxy or when the application sends links by
         email, add <usedefaulthostname/> here, and give the public host
         name, port and protocol to <host> below (attributes defaulthostname,
         defaulthttpport and defaultprotocol): the links then use them,
         rather than the Host header of the request, which a client can
         forge. -->
    <debugmode/>
    <extension findlib-package="ocsigenserver.ext.accesscontrol"/>
    <extension findlib-package="ocsigenserver.ext.cors"/>
    <extension findlib-package="ocsigenserver.ext.staticmod"/>
    <extension findlib-package="ocsipersist-sqlite-config">
      <database file="local/var/data/%%%PROJECT_NAME%%%/ocsidb"/>
    </extension>
    <extension findlib-package="eliom.server">
      <!-- Ask Eliom to ignore UTM parameters and others: -->
      <ignoredgetparams regexp="utm_[a-z]*|[a-z]*clid|li_fat_id"/>
      <!-- Enable WebAssembly support with automatic browser detection: -->
      <wasm enabled="true"/>
      <!-- Uncomment if you are using https only and want secure cookies:
       <securecookies value="true" />
      -->
    </extension>
    <host hostfilter="*">
      <static dir="local/var/www/%%%PROJECT_NAME%%%"/>
      <eliommodule findlib-package="%%%PROJECT_NAME%%%"/>
      <eliom/>
      <if>
        <!-- Remove the condition (or change it to true) if you're serving an iOS app and having
             "Origin null is not allowed by Access-Control-Allow-Origin.",
             since with iOS WkWebView, your origin is a local HTML file on the iOS platform. -->
        <header name="origin" regexp="http://localhost:8000"/>
        <then>
          <cors max_age="86400" credentials="true" methods="POST,GET,HEAD" exposed_headers="x-eliom-application,x-eliom-location,x-eliom-set-process-cookies,x-eliom-set-cookie-substitutes"/>
        </then>
      </if>
    </host>
  </server>
</ocsigen>
